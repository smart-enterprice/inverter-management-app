name: inverter_management_app
description: "Smart Enterprises — inverter sales, dispatch, and inventory management for dealers, salesmen, production, packing, delivery, and accounts teams."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

#----------------------dependencies----------------------#
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  multi_select_flutter: ^4.1.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.1.0
  fl_chart: ^1.0.0
  sidebarx: ^0.17.1
  google_nav_bar: ^5.0.7
  image_picker: ^1.1.2
  cool_dropdown: ^2.1.1
  dropdown_search: ^5.0.6
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  curl_logger_dio_interceptor: ^1.0.0
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.4
  timeago: ^3.6.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
#----------------------dev_dependencies----------------------#
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  #----------------------assets----------------------#
  assets:
    - assets/icons/
    - assets/logo/
    - assets/images/
    - assets/gif/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/smart_icon.png"
  adaptive_icon_background: "#1B4FD8"
  adaptive_icon_foreground: "assets/logo/smart_icon.png"

flutter_native_splash:
  color: "#185FA5"
  image: "assets/logo/smart_icon.png"
  android_12:
    color: "#185FA5"
    image: "assets/logo/smart_icon.png"
  android: true
  ios: true
  web: false



