name: inverter_management_app
description: "Smart Enterprises — inverter sales, dispatch, and inventory management for dealers, salesmen, production, packing, delivery, and accounts teams."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.2

#----------------------dependencies----------------------#
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  multi_select_flutter: ^4.1.3
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  flutter_svg: ^2.1.0
  fl_chart: ^1.0.0
  sidebarx: ^0.17.1
  google_nav_bar: ^5.0.7
  image_picker: ^1.1.2
  cool_dropdown: ^2.1.1
  dropdown_search: ^5.0.6
  shimmer: ^3.0.0
  connectivity_plus: ^6.0.3
  cached_network_image: ^3.4.1
  intl: ^0.19.0
  curl_logger_dio_interceptor: ^1.0.0
  url_launcher: ^6.2.6
  google_fonts: ^6.2.1
  flutter_local_notifications: ^17.2.4
  timeago: ^3.6.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_crashlytics: ^4.1.3
  device_info_plus: ^12.4.0
  package_info_plus: ^9.0.1
#----------------------dev_dependencies----------------------#
dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.1
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true

  #----------------------assets----------------------#
  assets:
    - assets/icons/
    - assets/logo/
    - assets/images/
    - assets/gif/


flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo/smart_icon.png"
  adaptive_icon_background: "#1B4FD8"
  adaptive_icon_foreground: "assets/logo/smart_icon.png"

flutter_native_splash:
  # No top-level `image` — Android < 12 / iOS would render the launcher PNG
  # at full pixel size, which caused the "huge icon then snaps to small"
  # flash before the Dart SplashScreen takes over. Keeping the bg colour
  # only means the user sees a solid blue boot screen, then the Dart
  # splash slides in with the properly-sized circular logo. No size jump.
  color: "#185FA5"
  android_12:
    # MUST be a 1152x1152 image whose artwork fits inside the centre ~768px
    # circle (≈1/3 transparent margin). The plain launcher PNG is full-bleed
    # (opaque 0..1024), so Android 12 rendered it edge-to-edge — the "big icon
    # that then snaps to the small Dart logo". This padded variant renders at
    # the correct, smaller size so the handoff to the Dart splash is smooth.
    color: "#185FA5"
    image: "assets/logo/smart_icon_android12.png"
  android: true
  ios: true
  web: false



